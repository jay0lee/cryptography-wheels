name: Build Cryptography Wheels

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_wheels.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      cryptography_version:
        description: 'Specific cryptography version tag (leave blank to read from GAM main pyproject.toml)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild even if latest release already matches'
        type: boolean
        default: true
  schedule:
    # Daily check at 10:00 UTC (automatically skips if neither cryptography version nor python-boringssl-latest changed)
    - cron: '0 10 * * *'

permissions:
  contents: write
  actions: read

jobs:
  discover:
    name: Discover Runners and Versions
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
      cryptography_version: ${{ steps.discovery.outputs.cryptography_version }}
      python_boringssl_tag: ${{ steps.discovery.outputs.python_boringssl_tag }}
      python_version: ${{ steps.discovery.outputs.python_version }}
      boringssl_version: ${{ steps.discovery.outputs.boringssl_version }}
      should_build: ${{ steps.discovery.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Discover dynamic runner matrix and dependency versions
        id: discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.cryptography_version }}" ]; then
            ARGS+=("--cryptography-version" "${{ github.event.inputs.cryptography_version }}")
          fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            ARGS+=("--force-rebuild")
          fi
          python3 scripts/discover_matrix.py "${ARGS[@]}"

  build_wheels:
    name: "Wheel: ${{ matrix.name }}"
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python + BoringSSL
        id: pybssl
        uses: jay0lee/python-boringssl-latest@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSVC developer command prompt (Windows)
        if: matrix.os_family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install prebuilt bindgen-cli
        uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: bindgen-cli

      - name: Install Linux build dependencies (libclang / patchelf)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev clang patchelf
          LIBCLANG_DIR="$(dirname "$(find /usr/lib -name 'libclang*.so*' 2>/dev/null | head -n1)")"
          if [ -n "$LIBCLANG_DIR" ] && [ -d "$LIBCLANG_DIR" ]; then
            echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          fi

      - name: Configure macOS deployment target and libclang
        if: matrix.os_family == 'macos'
        shell: bash
        run: |
          MACOS_MAJOR="$(sw_vers -productVersion | cut -d '.' -f 1)"
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOS_MAJOR}.0" >> "$GITHUB_ENV"
          echo "macOS deployment target: ${MACOS_MAJOR}.0"
          XCODE_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -d "$XCODE_LIB" ]; then
            echo "LIBCLANG_PATH=$XCODE_LIB" >> "$GITHUB_ENV"
          fi

      - name: Configure Windows LLVM/libclang and MSVC tools
        if: matrix.os_family == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\Git\usr\bin\link.exe") {
            Rename-Item -Path "C:\Program Files\Git\usr\bin\link.exe" -NewName "gnulink.exe" -Force -ErrorAction SilentlyContinue
          }

          $candidates = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files (x86)\LLVM\bin",
            "C:\ProgramData\chocolatey\bin"
          )
          $libclangDir = $null
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "libclang.dll")) {
              $libclangDir = $dir
              break
            }
          }

          if (-not $libclangDir) {
            $clangCmd = Get-Command clang -ErrorAction SilentlyContinue
            if ($clangCmd) {
              $parent = Split-Path -Parent $clangCmd.Source
              if (Test-Path (Join-Path $parent "libclang.dll")) {
                $libclangDir = $parent
              }
            }
          }

          if (-not $libclangDir) {
            Write-Host "LLVM/libclang not found; installing LLVM..."
            choco install llvm -y --no-progress
            foreach ($dir in @("C:\Program Files\LLVM\bin", "C:\ProgramData\chocolatey\bin")) {
              if (Test-Path (Join-Path $dir "libclang.dll")) {
                $libclangDir = $dir
                break
              }
            }
          }

          if (-not $libclangDir) {
            throw "Failed to locate libclang.dll required by bindgen"
          }
          Write-Host "Using LIBCLANG_PATH=$libclangDir"
          echo "LIBCLANG_PATH=$libclangDir" >> $env:GITHUB_ENV

      - name: Ensure bindgen CLI is available
        shell: bash
        run: |
          if ! command -v bindgen >/dev/null 2>&1; then
            cargo install --locked bindgen-cli
          fi
          bindgen --version

      - name: Configure BoringSSL and PyO3 environment
        shell: bash
        run: |
          if [[ "${{ matrix.os_family }}" == "windows" ]]; then
            echo "OPENSSL_DIR=$(cygpath -m "$BORINGSSL_INSTALL_PATH")" >> "$GITHUB_ENV"
          else
            echo "OPENSSL_DIR=${BORINGSSL_INSTALL_PATH}" >> "$GITHUB_ENV"
          fi
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1" >> "$GITHUB_ENV"
          ls -la "$BORINGSSL_INSTALL_PATH/lib"

      - name: Clone cryptography
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ needs.discover.outputs.cryptography_version }}" https://github.com/pyca/cryptography.git cryptography-src

      - name: Build cryptography wheel
        shell: bash
        run: |
          PKGS=("pip" "maturin>=1.14.1,<2" "cffi>=2.1" "setuptools!=74.0.0,!=74.1.0,!=74.1.1,!=74.1.2" "wheel")
          if [[ "${{ matrix.os_family }}" == "linux" ]]; then
            PKGS+=("auditwheel")
          fi
          "$PYTHON" -m pip install --upgrade "${PKGS[@]}"
          mkdir -p wheelhouse
          "$PYTHON" -m pip wheel cryptography-src \
            --no-build-isolation \
            --no-deps \
            --config-settings=build-args=--features=pyo3/abi3-py311 \
            -w wheelhouse/
          ls -lh wheelhouse/

      - name: Repair Linux wheel (manylinux)
        if: matrix.os_family == 'linux'
        shell: bash
        run: |
          "$PYTHON" scripts/repair_linux_wheel.py --wheelhouse wheelhouse
          ls -lh wheelhouse/

      - name: Smoketest built wheel
        shell: bash
        run: |
          rm -rf cryptography-src
          "$PYTHON" -m venv smoketest-venv
          if [[ "${{ matrix.os_family }}" == "windows" ]]; then
            VENV_PY="smoketest-venv/Scripts/python.exe"
          else
            VENV_PY="smoketest-venv/bin/python"
          fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install wheelhouse/*.whl
          if [[ "${{ matrix.os_family }}" == "macos" ]]; then
            find smoketest-venv/lib/*/site-packages/cryptography/hazmat/bindings -name '*.so' -exec otool -L {} \; -exec vtool -show {} \;
          elif [[ "${{ matrix.os_family }}" == "linux" ]]; then
            find smoketest-venv/lib/*/site-packages/cryptography/hazmat/bindings -name '*.so' -exec ldd {} \;
          fi
          "$VENV_PY" scripts/smoketest_wheel.py

      - name: Upload built wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 2

  release_wheels:
    name: Release Wheels
    needs: [discover, build_wheels]
    if: needs.discover.outputs.should_build == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download all built wheels
        uses: actions/download-artifact@v8
        with:
          path: all_wheels
          pattern: wheel-*

      - name: Get release date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Deduplicate wheels and generate manifest
        env:
          RELEASE_TAG: release-${{ steps.date.outputs.date }}-${{ github.run_id }}
        run: |
          python3 scripts/prepare_release.py \
            --input-dir all_wheels \
            --output-dir release_assets \
            --release-tag "$RELEASE_TAG" \
            --cryptography-version "${{ needs.discover.outputs.cryptography_version }}" \
            --python-boringssl-tag "${{ needs.discover.outputs.python_boringssl_tag }}" \
            --python-version "${{ needs.discover.outputs.python_version }}" \
            --boringssl-version "${{ needs.discover.outputs.boringssl_version }}"
          ls -lh release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.date.outputs.date }}-${{ github.run_id }}
          name: "cryptography ${{ needs.discover.outputs.cryptography_version }} + BoringSSL (${{ steps.date.outputs.date }})"
          body: |
            Automated `cryptography` ${{ needs.discover.outputs.cryptography_version }} (`abi3`, BoringSSL static build) wheels built with [`${{ needs.discover.outputs.python_boringssl_tag }}`](https://github.com/jay0lee/python-boringssl-latest/releases/tag/${{ needs.discover.outputs.python_boringssl_tag }}).

            - **Python**: ${{ needs.discover.outputs.python_version }}
            - **BoringSSL**: ${{ needs.discover.outputs.boringssl_version }}
            - **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_assets/*
